name: Syntax Analyzer CI

on:
  push:
    branches: [main]
    tags: ['syntax-submission-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  linux-ubuntu:
    name: Ubuntu 24.04 C17 Syntax Check, Sanitizers & Demo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check environment
        shell: bash
        run: sh scripts/build.sh environment

      - name: Run syntax analyzer C17 check suite
        shell: bash
        run: sh scripts/build.sh syntax-check

      - name: Run syntax analyzer ASan and UBSan suite
        shell: bash
        run: sh scripts/build.sh syntax-sanitize

      - name: Run POSIX coursework demo
        shell: bash
        run: |
          set -eu
          sh scripts/run-syntax-demo.sh examples/syntax/complete.tfd demo-output
          grep -q 'AST root=1 has_errors=false nodes=469' demo-output/ast.txt

  windows-x64:
    name: Windows x64 Full Build, Sanitizers, Demo & Source/Win64 Packages
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      source_sha256: ${{ steps.pkg.outputs.source_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned LLVM-MinGW toolchain
        shell: pwsh
        run: |
          $cc = ./scripts/windows-toolchain.ps1
          "TF_CI_CC=$cc" >> $env:GITHUB_ENV

      - name: Check environment
        shell: pwsh
        run: ./scripts/build.ps1 environment -Compiler $env:TF_CI_CC

      - name: Build and run strict C17 suite
        shell: pwsh
        run: ./scripts/build.ps1 check -Compiler $env:TF_CI_CC

      - name: Run ASan and UBSan suite
        shell: pwsh
        run: ./scripts/build.ps1 sanitize -Compiler $env:TF_CI_CC

      - name: Run one-command coursework demo
        shell: pwsh
        run: ./scripts/run-syntax-demo.ps1 -Compiler $env:TF_CI_CC -IncludeInvalid -TraceTokens

      - name: Build and verify fresh-extraction Source and Windows x64 ZIPs
        id: pkg
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'syntax-dist'
          ./scripts/package-syntax-analyzer.ps1 -Tag syntax-submission-2026-11-27 -Compiler $env:TF_CI_CC -OutDir $dir
          $rel = Join-Path $dir 'syntax-submission-2026-11-27'
          ./scripts/verify-syntax-packages.ps1 -ReleaseDir $rel -Compiler $env:TF_CI_CC -TempRoot (Join-Path $env:RUNNER_TEMP 'fresh-verify')
          $srcHash = ((Get-Content -LiteralPath (Join-Path $rel 'Ternfold_Syntax_Analyzer_Source_2026-11-27.zip.sha256')).Trim() -split '\s+')[0].ToLowerInvariant()
          "source_sha256=$srcHash" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: syntax-source-package
          path: |
            ${{ runner.temp }}/syntax-dist/syntax-submission-2026-11-27/Ternfold_Syntax_Analyzer_Source_2026-11-27.zip
            ${{ runner.temp }}/syntax-dist/syntax-submission-2026-11-27/Ternfold_Syntax_Analyzer_Source_2026-11-27.zip.sha256
            ${{ runner.temp }}/syntax-dist/syntax-submission-2026-11-27/Ternfold_Syntax_Analyzer_Source_2026-11-27.zip.manifest.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: syntax-windows-package
          path: |
            ${{ runner.temp }}/syntax-dist/syntax-submission-2026-11-27/Ternfold_Syntax_Analyzer_Windows_x64_2026-11-27.zip
            ${{ runner.temp }}/syntax-dist/syntax-submission-2026-11-27/Ternfold_Syntax_Analyzer_Windows_x64_2026-11-27.zip.sha256
            ${{ runner.temp }}/syntax-dist/syntax-submission-2026-11-27/Ternfold_Syntax_Analyzer_Windows_x64_2026-11-27.zip.manifest.json
          if-no-files-found: error

  macos-payloads:
    name: Build & Verify macOS Payload (${{ matrix.target }})
    needs: windows-x64
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: syntax-source-package
          path: ${{ runner.temp }}/srcpkg

      - name: Build and verify native Mach-O payload (${{ matrix.target }})
        shell: bash
        env:
          SOURCE_SHA256: ${{ needs.windows-x64.outputs.source_sha256 }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          payload="$RUNNER_TEMP/$TARGET-payload"
          sh scripts/package-mac-payload.sh \
            "$RUNNER_TEMP/srcpkg/Ternfold_Syntax_Analyzer_Source_2026-11-27.zip" \
            "$payload" \
            "$SOURCE_SHA256"
          (cd "$payload" && zip -q -r "$RUNNER_TEMP/$TARGET.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: syntax-${{ matrix.target }}-payload
          path: ${{ runner.temp }}/${{ matrix.target }}.zip
          if-no-files-found: error

  assemble-all-in-one:
    name: Assemble Cross-Platform All-In-One ZIP
    needs: [windows-x64, macos-payloads]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: syntax-windows-package
          path: ${{ runner.temp }}/win

      - uses: actions/download-artifact@v4
        with:
          name: syntax-macos-arm64-payload
          path: ${{ runner.temp }}/arm

      - uses: actions/download-artifact@v4
        with:
          name: syntax-macos-x64-payload
          path: ${{ runner.temp }}/x64

      - name: Assemble unified All-In-One archive
        shell: bash
        env:
          SOURCE_SHA256: ${{ needs.windows-x64.outputs.source_sha256 }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/allinone"
          sh scripts/assemble-all-in-one.sh \
            "$RUNNER_TEMP/win/Ternfold_Syntax_Analyzer_Windows_x64_2026-11-27.zip" \
            "$RUNNER_TEMP/arm/macos-arm64.zip" \
            "$RUNNER_TEMP/x64/macos-x64.zip" \
            "$RUNNER_TEMP/allinone/Ternfold_Syntax_Analyzer_All_In_One_2026-11-27.zip" \
            "$SOURCE_SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: syntax-all-in-one-package
          path: ${{ runner.temp }}/allinone/*
          if-no-files-found: error

  verify-all-in-one:
    name: Fresh-Extraction Verification (${{ matrix.os }})
    needs: [windows-x64, assemble-all-in-one]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: syntax-all-in-one-package
          path: ${{ runner.temp }}/allinone

      - name: Verify All-In-One ZIP on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SOURCE_SHA256: ${{ needs.windows-x64.outputs.source_sha256 }}
        run: |
          ./scripts/verify-all-in-one-windows.ps1 `
            -Zip (Join-Path $env:RUNNER_TEMP 'allinone/Ternfold_Syntax_Analyzer_All_In_One_2026-11-27.zip') `
            -SourceSha256 $env:SOURCE_SHA256 `
            -TempRoot (Join-Path $env:RUNNER_TEMP 'allinone-win-verify')

      - name: Verify All-In-One ZIP on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          SOURCE_SHA256: ${{ needs.windows-x64.outputs.source_sha256 }}
        run: |
          sh scripts/verify-all-in-one-mac.sh \
            "$RUNNER_TEMP/allinone/Ternfold_Syntax_Analyzer_All_In_One_2026-11-27.zip" \
            "$RUNNER_TEMP/allinone-mac-verify" \
            "$SOURCE_SHA256"
